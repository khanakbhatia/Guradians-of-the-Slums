[project]
name = "guardians-ai-service"
version = "0.1.0"
description = "M3 AI service architecture for Guardians of the Slums."
requires-python = ">=3.11"
dependencies = [
  "beeai-framework",
  "faiss-cpu>=1.9.0",
  "fastapi>=0.115.0",
  "ibm-watsonx-ai>=1.3.0",
  "langchain-core>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "networkx>=3.4",
  "numpy>=2.1.0",
  "opencv-python>=4.10.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "rasterio>=1.4.0",
  "ultralytics>=8.3.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
