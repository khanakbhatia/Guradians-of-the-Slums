services:
  - type: web
    name: guardians-platform-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Every other variable (MONGO_URI, JWT_SECRET, CLOUDINARY_*, EMAIL_*,
      # etc.) is marked sync:false — Render prompts for these in the
      # dashboard rather than storing secrets in this committed file.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WINSTON_LOG_LEVEL
        value: info
      - key: MORGAN_FORMAT
        value: combined
